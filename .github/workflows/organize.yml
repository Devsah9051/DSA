name: Auto Organize DSA Folders

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Sort Problems into Topic Folders
        run: |
          python - << 'EOF'
          import os
          import shutil
          import re

          TOPIC_MAP = {
              "Array": ["array", "two-pointers", "sliding-window", "matrix"],
              "LinkedList": ["linked-list", "linkedlist"],
              "String": ["string"],
              "Stack-Queue": ["stack", "queue", "monotonic-stack"],
              "Trees-Graphs": ["tree", "graph", "binary-tree", "dfs", "bfs", "trie"],
              "DynamicProgramming": ["dynamic-programming", "dp"],
              "Sorting-Searching": ["binary-search", "sorting"]
          }

          root = "."
          entries = [f for f in os.listdir(root) if os.path.isdir(f) and not f.startswith('.')]

          for folder in entries:
              # Avoid re-processing organized topic folders
              if folder in TOPIC_MAP or folder == "Uncategorized":
                  continue

              # Target standard LeetCode folders (e.g., 0001-two-sum or 1-two-sum)
              if re.match(r'^\d+[\w-]*$', folder):
                  target_topic = "Uncategorized"
                  readme_path = os.path.join(folder, "README.md")
                  
                  if os.path.exists(readme_path):
                      with open(readme_path, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read().lower()
                          for topic, keywords in TOPIC_MAP.items():
                              if any(kw in content for kw in keywords):
                                  target_topic = topic
                                  break

                  target_dir = os.path.join(target_topic, folder)
                  os.makedirs(target_topic, exist_ok=True)
                  print(f"Moving {folder} -> {target_dir}")
                  shutil.move(folder, target_dir)
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "auto: organize problem folders into topic directories [skip ci]"
            git push
          else
            echo "No directory reorganization needed."
          fi
